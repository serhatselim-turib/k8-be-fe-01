# Opsiyonel: ingress-nginx controller kuruluysa kullan.
# hosts dosyasına: 127.0.0.1 demo.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-frontend
                port: { number: 80 }
