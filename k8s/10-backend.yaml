apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: demo
  labels: { app: demo-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-backend }
  template:
    metadata:
      labels: { app: demo-backend }
    spec:
      containers:
        - name: backend
          image: demo-backend:latest
          imagePullPolicy: IfNotPresent   # lokal imaj (Docker Desktop / minikube / kind)
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: k8s
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend          # FE bu DNS adıyla erişir: http://demo-backend:8080
  namespace: demo
spec:
  type: ClusterIP
  selector: { app: demo-backend }
  ports:
    - port: 8080
      targetPort: 8080
